name: Daily Taiwan Stock Momentum Report

on:
  schedule:
    - cron: "30 9 * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: daily-tw-stock-momentum-report
  cancel-in-progress: false

jobs:
  build-and-publish:
    runs-on: ubuntu-latest
    timeout-minutes: 300
    steps:
      - name: Checkout report repository
        uses: actions/checkout@v4
        with:
          ref: master

      - name: Checkout skill repository
        uses: actions/checkout@v4
        with:
          repository: MasonLee3721/agent_skills
          ref: main
          path: _agent_skills

      - name: Install uv
        uses: astral-sh/setup-uv@v6

      - name: Generate validated report
        working-directory: _agent_skills/kiro/kiro7/tw-stock-momentum-report
        run: uv run --python 3.12 scripts/run_scheduled_daily.py --output-dir output --attempts 16 --interval-seconds 900

      - name: Copy report artifacts
        shell: bash
        run: |
          set -euo pipefail
          SOURCE="_agent_skills/kiro/kiro7/tw-stock-momentum-report/output"
          DAY="$(jq -r '.trade_date' "$SOURCE/data/daily_scores_latest.json")"
          test "$DAY" != "null"
          STAMP="${DAY//-/}"
          DEST="kiro7_韋小寶/tw-stock-momentum-report/output"
          mkdir -p "$DEST/data"
          cp "$SOURCE/latest.html" "$DEST/latest.html"
          cp "$SOURCE/tw_stock_momentum_report_${STAMP}.html" "$DEST/"
          cp "$SOURCE/data/report_${STAMP}.json" "$DEST/data/"
          cp "$SOURCE/data/daily_run_status.json" "$DEST/data/"

      - name: Commit and push report
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "FangYi Report Bot"
          git config user.email "MasonLee3721@users.noreply.github.com"
          git add -- "kiro7_韋小寶/tw-stock-momentum-report/output"
          if git diff --cached --quiet; then
            echo "No report changes"
            exit 0
          fi
          DAY="$(jq -r '.trade_date' _agent_skills/kiro/kiro7/tw-stock-momentum-report/output/data/daily_scores_latest.json)"
          git commit -m "data: publish momentum report $DAY"
          git push origin master

      - name: Notify Discord
        if: always()
        env:
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
          JOB_STATUS: ${{ job.status }}
        shell: bash
        run: |
          set -euo pipefail
          if [ -z "${DISCORD_WEBHOOK_URL:-}" ]; then
            echo "DISCORD_WEBHOOK_URL is not configured; skipping notification"
            exit 0
          fi
          SOURCE="_agent_skills/kiro/kiro7/tw-stock-momentum-report/output"
          DAY="unknown"
          if [ -f "$SOURCE/data/daily_scores_latest.json" ]; then
            DAY="$(jq -r '.trade_date // "unknown"' "$SOURCE/data/daily_scores_latest.json")"
          fi
          REPORT_URL="https://masonlee3721.github.io/kiro-notes/kiro7_%E9%9F%8B%E5%B0%8F%E5%AF%B6/tw-stock-momentum-report/output/latest.html"
          RUN_URL="https://github.com/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}"
          if [ "$JOB_STATUS" = "success" ]; then
            MESSAGE="✅ 台股動能報告完成｜交易日：$DAY｜報告：$REPORT_URL｜執行紀錄：$RUN_URL"
          else
            MESSAGE="❌ 台股動能報告失敗｜交易日：$DAY｜請檢查：$RUN_URL"
          fi
          jq -n --arg content "$MESSAGE" '{content: $content}' |
            curl --silent --show-error --fail-with-body -H "Content-Type: application/json" -d @- "$DISCORD_WEBHOOK_URL"
